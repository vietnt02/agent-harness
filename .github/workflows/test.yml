name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test tests/

      - name: Test installer twice
        shell: bash
        run: |
          TMP_HOME=$(node -e "console.log(require('fs').mkdtempSync(require('path').join(require('os').tmpdir(), 'harness-ci-')))")
          echo "Installing to $TMP_HOME"
          node install.cjs --home "$TMP_HOME"
          echo "Running install second time"
          node install.cjs --home "$TMP_HOME"
